name: Keep Backend Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://vaibhav-fundsroom-erp-crm.onrender.com/health)
          echo "Health check responded with status: $response"
          if [ "$response" -ne 200 ]; then
            echo "Warning: backend did not return 200"
          fi
